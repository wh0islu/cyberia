{% extends 'global/base.html' %}
{% block content %}
{% if user.is_authenticated %}
<div id="booksContent">
    <div class="grid">
        {% for book in books %}
        <div class="grid-item">
            {% if book.cover %}
            <img src="{{ book.cover.url }}" alt="{{ book.title }}"/>
            {% endif %}
            <h3>{{ book.title }}</h3>
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
{% endblock content %}
