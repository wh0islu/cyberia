{% extends 'global/base.html' %}
{% block content %}

<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50">

  <div class="bg-white dark:bg-dark-surface rounded-xl shadow-xl max-w-lg w-full p-6 space-y-6">

    <!-- Header -->
    <div class="text-center space-y-2">
      <h2 class="text-xl font-semibold text-gray-900 dark:text-white">
        Save your seed phrases
      </h2>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Write these words down in order and keep them safe.
      </p>
    </div>

    <!-- Seed grid -->
    <div class="grid grid-cols-3 gap-3">
      {% for word in seed %}
        <div class="flex items-center gap-2 rounded-md border border-gray-300 dark:border-gray-700 px-3 py-2 text-sm">
          <span class="text-gray-400">{{ forloop.counter }}.</span>
          <span class="font-mono text-gray-900 dark:text-white">{{ word }}</span>
        </div>
      {% endfor %}
    </div>

    <!-- Warning -->
    <div class="rounded-md bg-yellow-100 dark:bg-yellow-900/30 px-4 py-2 text-sm text-yellow-800 dark:text-yellow-300">
      ⚠️ These words will not be shown again.
    </div>

    <!-- Action -->
    <div class="flex justify-end">
      <a href="{% url 'loginUser' %}"
         class="rounded-md bg-black dark:bg-brand-primary text-white px-4 py-2 hover:opacity-90 transition">
        I saved it
      </a>
    </div>

  </div>

</div>

{% endblock %}
