{% extends "main.html" %}
{% block content %}

<div class="min-h-screen grid grid-cols-1 lg:grid-cols-2 pt-16">

  <!-- LEFT: LOGIN FORM -->
  <div class="flex items-center justify-center px-6">
    <div class="w-full max-w-md space-y-6">

      <!-- Header -->
      <div class="space-y-2">
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-white">
          Log into your account
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">
          Welcome back to Cyberia
        </p>
      </div>

      <!-- Form -->
      <form method="POST" class="space-y-4" onsubmit="showSpinner()">
        {% csrf_token %}

        <!-- Username -->
        <div>
          <label class="block text-sm mb-1">Username</label>
          <input
            type="text"
            name="username"
            placeholder="akira"
            required
            class="w-full rounded-md border border-gray-300 dark:border-gray-700
                   px-3 py-2 bg-white dark:bg-dark-surface
                   focus:outline-none focus:ring-2
                   focus:ring-brand-primary"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm mb-1">Password</label>
          <input
            type="password"
            name="password"
            placeholder="••••••••"
            required
            class="w-full rounded-md border border-gray-300 dark:border-gray-700
                   px-3 py-2 bg-white dark:bg-dark-surface
                   focus:outline-none focus:ring-2
                   focus:ring-brand-primary"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full mt-4 flex items-center justify-center gap-2
                 rounded-md px-4 py-2 font-medium transition
                 bg-black dark:bg-brand-primary text-white
                 hover:opacity-90"
        >
          <span id="btn-text">Sign in</span>

          <!-- Spinner -->
          <svg
            id="spinner"
            class="hidden h-5 w-5 animate-spin text-white"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            />
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
            />
          </svg>
        </button>
      </form>

      <!-- Footer -->
      <div class="text-sm text-gray-500 dark:text-gray-400 space-y-1">
        <p>
          Don't have an account?
          <a
            href="{% url 'registerUser' %}"
            class="text-brand-primary hover:underline"
          >
            Sign up
          </a>
        </p>
        <p>
          Forgot your password?
          <a
            href="{% url 'recovery' %}"
            class="text-brand-primary hover:underline"
          >
            Try with seedphrases
          </a>
        </p>
      </div>

    </div>
  </div>

  <!-- RIGHT: VISUAL PLACEHOLDER (consistência com register) -->
  <div class="hidden lg:flex items-center justify-center bg-gray-50 dark:bg-dark-surface">
    <!-- intencionalmente vazio ou pode repetir a arte -->
  </div>

</div>

{% endblock %}
