[project]
name = "cyberia"
version = "0.1.0"
description = ""
authors = [
    {name = "kaizen",email = "bcc8a62d41d282a9fe0ec7ae4c8b57bb@proton.me"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.0.1,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "django-widget-tweaks (>=1.5.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.14,<0.15.0)",
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.ruff]
line-length = 85
src = ["apps"]
extend-exclude = ["migrations"]


[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]


[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.taskipy.tasks]
lint = "ruff check apps"
pre_format = "ruff check apps --fix"
format = "ruff format apps"
run = "python manage.py runserver"
migrate = "python manage.py migrate"
makemigrations = "python manage.py makemigrations"
pre_test = "task lint"
test = "pytest -s -x --cov=apps -vv"
post_test = "coverage html"
