{% extends 'main.html' %}
{% block content %}
<style>
  html,body{
    height:100%;
    margin:0;
    background:#050505;
  }

  :root{
    --glow: rgba(126,240,255,0.12);
  }

  .lain-wrapper{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: "Noto Sans JP", "Noto Serif JP", "Georgia", serif;
    color:#e9f6f9;
    position:relative;
    overflow:hidden;
  }

  /* scanlines sutis */
  .lain-wrapper::after{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(rgba(0,0,0,0.03) 0 1px, transparent 1px 3px);
    z-index:1;
    pointer-events:none;
  }

  .center-box{
    position:relative;
    z-index:2;
    width:calc(100% - 120px);
    max-width:900px;
    padding:48px 32px;
    text-align:center;
    border-radius:8px;
    background: rgba(0,0,0,0.14);
    border: 1px solid rgba(255,255,255,0.03);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    backdrop-filter: blur(2px);
  }

  .jp-text{
    font-family: "Noto Sans JP", "Noto Serif JP", sans-serif;
    font-weight:700;
    font-size:56px;
    margin:0 0 18px 0;
    line-height:1;
    color:#f7ffff;
    text-shadow:
      0 2px 6px rgba(0,0,0,0.6),
      0 0 16px var(--glow);
  }

  .en-text{
    font-family: "Georgia", serif;
    font-size:34px;
    margin:0;
    color:#e7f2f4;
    text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 10px rgba(126,240,255,0.06);
    letter-spacing:0.3px;
  }

  @media (max-width:720px){
    .center-box{ padding:22px 14px; }
    .jp-text{ font-size:34px; }
    .en-text{ font-size:18px; }
  }
</style>

<div class="lain-wrapper" role="main">
  <div class="center-box">
    <h1 class="jp-text">すぐにサイバーリアに来てください！</h1>
    <p class="en-text">Come to the Cyberia as soon as you can.</p>
  </div>
</div>
{% endblock content %}
